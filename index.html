<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hard-Locked Composite</title>
  <style>
    html, body { margin:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height:560vh; }

    #stage{
      position:fixed; inset:0;
      z-index:2; pointer-events:none;
      overflow:hidden; background:#000;
    }

    /* Frozen background frame */
    #bgFrame{
      position:absolute;
      left:0; top:0;
      width:100px; height:100px;   /* set once in JS */
      overflow:hidden;
      z-index:1;
      will-change:transform;
      transform-origin:top left;
    }

    #bgLayer{
      position:absolute;
      left:0; top:0;
      width:100%; height:100%;
      object-fit:fill;             /* we control exact frame size ourselves */
      user-select:none; -webkit-user-drag:none;
    }

    /* Frozen head anchor */
    #headShell{
      position:absolute;
      left:50%;
      top:0;
      width:1000px;
      height:1000px;
      transform:translateX(-50%);
      transform-origin:top center;
      z-index:2;
      will-change:transform;
    }

    #headSvg{
      width:100%; height:100%;
      display:block;
      overflow:visible;
    }
  </style>
</head>
