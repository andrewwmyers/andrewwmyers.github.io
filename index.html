<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height: 520vh; }

    #stage{
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    #headShell{
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }

    #headSvg{
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>

  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">

        <defs>

            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathLeft" d="M0 0 Z" fill="white"></path>
          </mask>

          <mask id="oozeMaskRight" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">

            <path id="oozePathRight" d="M0 0 Z" fill="white"></path>
          </mask>
        </defs>

        <image href="./head-base.png" xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"

      </svg>
    </div>
  </div>
