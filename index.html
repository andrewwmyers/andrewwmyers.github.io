<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
</head>
<body style="margin:0;background:#000;min-height:320vh;overflow-x:hidden;">

  <!-- Base image (always visible, fixed/static) -->
  <div style="
    position:fixed;
    inset:0;
    background:url('./base.png') center top / cover no-repeat;
    z-index:0;
  "></div>

  <!-- Bleed image (revealed through moving mask) -->
  <div id="bleedLayer" style="
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:url('./bleed.png') center top / cover no-repeat;

    /* Mask setup */
    -webkit-mask-image: url('./wipe-mask.png');
    mask-image: url('./wipe-mask.png');
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 100% auto;
    mask-size: 100% auto;

    /* Start with mask mostly above viewport so bleed is hidden */
    -webkit-mask-position: center -140vh;
    mask-position: center -140vh;
  "></div>

  <script>
    // Tune these
    const HEADER_HEIGHT = 230; // start when header is gone
    const WIPE_RANGE = 1400;   // scroll distance to complete reveal

    const bleedLayer = document.getElementById('bleedLayer');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function update() {
      const y = window.scrollY || window.pageYOffset || 0;

      // Trigger only after user scrolls past header
      const pastTrigger = Math.max(0, y - HEADER_HEIGHT);
      const progress = clamp(pastTrigger / WIPE_RANGE, 0, 1);

      // Move mask downward through viewport for organic reveal
      // from -140vh (hidden) to 20vh (revealed)
      const start = -140;
      const end = 20;
      const posY = start + (end - start) * progress;
      const pos = `center ${posY}vh`;

      bleedLayer.style.webkitMaskPosition = pos;
      bleedLayer.style.maskPosition = pos;

      requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
