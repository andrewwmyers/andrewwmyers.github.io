  <title>Wade Myers – Floating Head</title>

    html, body {
      margin: 0;
      background: #000;
      overflow-x: hidden;
    }

    .scroll-runway {
      height: 520vh; /* enough runway so bleed completes */
    }

    #stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;         /* full-bleed */
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }

    #bgLayer { z-index: 1; }
    #headBaseLayer { z-index: 2; }

    #bleedSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      will-change: transform;
    }
  </style>
</head>
