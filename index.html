<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers – Floating Head</title>
  <style>
    html, body { margin: 0; background: #000; overflow-x: hidden; }

    /* Scroll distance for full effect */
    .scroll-runway { height: 520vh; }

    /* Pinned stage */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      background: #000;
    }

    /* Full-bleed background (no black borders) */
    #bgLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Head system */
    #headSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: visible;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bgLayer" src="./bg-base.png" alt="">

    <svg id="headSvg"
         viewBox="0 0 1000 1000"
         preserveAspectRatio="xMidYMin meet"
         aria-hidden="true"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink">

      <defs>
        <!-- IMPORTANT: use objectBoundingBox so both head images can share this cleanly -->
        <clipPath id="dripClip" clipPathUnits="objectBoundingBox">
          <path id="leftClip" d=""></path>
          <path id="rightClip" d=""></path>
        </clipPath>
      </defs>

      <g id="headGroup" transform="translate(0,0)">
        <!-- Base head -->
        <image id="headBase"
               href="./head-base.png"
               xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <!-- Bleed head -->
        <image id="headBleed"
               href="./head-bleed.png"
               xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               clip-path="url(#dripClip)"></image>
      </g>
    </svg>
  </div>

  <script>
    // =========================
    // Tunables
    // =========================

    // Fraction of viewport used by your white header.
    // Head top is aligned exactly under this.
    const WHITE_HEADER_FRAC = 0.14;  // tweak if needed (e.g. 0.13 / 0.15)

    const BLEED_START_DELAY_VH = 0.00;
    const WIPE_RANGE_VH = 1.15;      // length of bleed reveal

    // Drip progression in normalized 0..1 image space
    const BLEED_START_Y = 0.20;
    const BLEED_TRAVEL  = 0.92;

    // Eye centers (normalized 0..1 across image width)
    const LEFT_INNER_X  = 0.495;
    const RIGHT_INNER_X = 0.53;

    const MAX_LEFT_WIDTH  = 0.28;
    const MAX_RIGHT_WIDTH = 0.28;
    const DRIP_HALF_WIDTH = 0.012;

    const L_COUNT = 14, R_COUNT = 14;

    // =========================
    // Elements
    // =========================
    const bgLayer   = document.getElementById('bgLayer');
    const headGroup = document.getElementById('headGroup');
    const leftClip  = document.getElementById('leftClip');
    const rightClip = document.getElementById('rightClip');

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp  = (a, b, t) => a + (b - a) * t;

    let smoothP = 0;
    let lastTs = 0;

    const leftLaneY  = Array.from({ length: L_COUNT + 1 }, () => 0);
    const rightLaneY = Array.from({ length: R_COUNT + 1 }, () => 0);

    // Head uses preserveAspectRatio="meet" inside viewport
    // For 1000x1000 square: rendered size is min(vw, vh)
    function getHeadRenderedSizePx() {
      const vw = window.innerWidth || 1;
      const vh = window.innerHeight || 1;
      const s = Math.min(vw, vh);
      return { w: s, h: s };
    }

    function buildDripRectsOBB(xStart, dir, y, width, t, laneCount, dt, laneBuf) {
      // objectBoundingBox path coordinates are 0..1
      const xEnd = clamp(xStart + dir * width, 0, 1);
      const t1 = t * 0.0013;
      const t2 = t * 0.0020;
      let d = "";

      for (let i = 0; i <= laneCount; i++) {
        const u = i / laneCount;
        const w = 1 - u;
        const x = lerp(xStart, xEnd, u);

        const baseDepth = y + w * 0.28 + (1 - w) * 0.10;
        const wobble =
          Math.sin(t1 + i * 1.05) * (0.006 + w * 0.007) +
          Math.sin(t2 + i * 1.81) * 0.004;

        const targetY = clamp(baseDepth + wobble, 0, 1);
        const follow = 1 - Math.exp(-dt * 18);
        laneBuf[i] += (targetY - laneBuf[i]) * follow;

        const yy = clamp(laneBuf[i], 0, 1);
        const xl = clamp(x - DRIP_HALF_WIDTH, 0, 1);
        const xr = clamp(x + DRIP_HALF_WIDTH, 0, 1);

        d += `M ${xl} 0 L ${xr} 0 L ${xr} ${yy} L ${xl} ${yy} Z `;
      }

      return d;
    }
