<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background:#000; color:#fff; font-family: Arial, sans-serif; }

    .bg {
      position: fixed;
      inset: 0;
      background: url('./bg-desktop.png') center top / cover no-repeat;
      z-index: 0;
    }

    .lines-wrap {
      position: fixed;
      left: 50%;
      top: 13.5%;
      transform: translateX(-50%);
      width: min(22vw, 360px);
      height: 80vh;
      overflow: hidden;
      z-index: 1; /* behind content */
      pointer-events: none;
    }

    .lines {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      clip-path: inset(100% 0 0 0); /* hidden initially */
      opacity: 0.95;
    }

    .hero-header {
      position: relative;
      height: 230px;
      z-index: 3;
    }

    .hero-header img.header-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-header img.header-logo {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(42vw, 520px);
      height: auto;
    }

    .content {
      position: relative;
      z-index: 2; /* above lines */
    }

    .panel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.45);
      padding: 12px 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .hero-header { height: 160px; }
      .hero-header img.header-logo { width: min(68vw, 420px); }
      .lines-wrap { top: 14.5%; width: min(34vw, 300px); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="lines-wrap">
    <img class="lines" src="./lines-animation.png" alt="" />
  </div>

  <header class="hero-header" id="heroHeader">
    <img class="header-bg" src="./header.png" alt="" />
    <img class="header-logo" src="./header-logo.png" alt="Wade Myers" />
  </header>

  <main class="content">
    <section id="listen" class="panel"><div class="chip">Listen</div></section>
    <section id="watch" class="panel"><div class="chip">Watch</div></section>
    <section id="store" class="panel"><div class="chip">Store</div></section>
    <section id="about" class="panel"><div class="chip">About</div></section>
    <section id="contact" class="panel"><div class="chip">Contact</div></section>
  </main>

  <script>
    const header = document.getElementById('heroHeader');
    const lines = document.querySelector('.lines');
    const RANGE = 1500; // scroll distance to fully reveal lines

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function tick() {
      const headerBottom = header.getBoundingClientRect().bottom;
      const startedAmount = Math.max(0, -headerBottom); // starts when header is out of view
      const progress = clamp(startedAmount / RANGE, 0, 1);

      // Reveal top -> bottom
      const hiddenTopPercent = (1 - progress) * 100;
      lines.style.clipPath = `inset(${hiddenTopPercent}% 0 0 0)`;

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
