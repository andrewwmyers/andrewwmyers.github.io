<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height: 430vh; }

    #stage{
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    #headShell{
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }

    #headSvg{
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">

        <defs>
          <mask id="oozeMaskLeft" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathLeft" d="M0 0 L0 0 Z" fill="white"></path>
          </mask>

          <mask id="oozeMaskRight" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathRight" d="M0 0 L0 0 Z" fill="white"></path>
          </mask>
        </defs>

        <!-- base -->
        <image href="./head-base.png" xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <!-- bleed left-eye column -->
        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskLeft)"></image>

        <!-- bleed right-eye column -->
        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskRight)"></image>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const leftPath = document.getElementById('oozePathLeft');
      const rightPath = document.getElementById('oozePathRight');
      if (!leftPath || !rightPath) return;

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      // Per your requirement:
      const START_Y_FRAC = 0.045;

      // Scroll timing
      const WIPE_START_PX = 0;
      const WIPE_RANGE_PX = 3000;

      // Two narrow wipe columns aligned to eyes (0..1000 space)
      const LEFT_CENTER_X  = 455;
      const RIGHT_CENTER_X = 545;
      const HALF_WIDTH = 42;

      // Extra drippy / random
      const LANES = 18;
      const WOBBLE_PX = 14;
      const DRIP_PX = 210;
      const FRONT_FOLLOW = 6;
      const LANE_FOLLOW_MIN = 6;
      const LANE_FOLLOW_MAX = 12;

      let smoothP = 0;
      let lastTs = 0;

      function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      function makeState(seed) {
        return Array.from({ length: LANES + 1 }, (_, i) => ({
          y: START_Y_FRAC * 1000,
          lag: LANE_FOLLOW_MIN + (LANE_FOLLOW_MAX - LANE_FOLLOW_MIN) * hash(seed + i * 1.7),
          a: hash(seed + i * 2.3) * Math.PI * 2,
          b: hash(seed + i * 3.1) * Math.PI * 2,
          amp: 0.7 + 0.8 * hash(seed + i * 4.9),
          bias: 1.2 + 1.8 * hash(seed + i * 6.7)
        }));
      }

      const leftState = makeState(10);
      const rightState = makeState(90);

      function buildColumnPath(centerX, halfW, state, ts, dt, progress, idBase) {
        const x0 = clamp(centerX - halfW, 0, 1000);
        const x1 = clamp(centerX + halfW, 0, 1000);

        const leadY = START_Y_FRAC * 1000 + progress * ((1 - START_Y_FRAC) * 1000);
        const env = Math.sin(Math.PI * progress);
        const t1 = ts * 0.0011;
        const t2 = ts * 0.0019;

        let d = `M ${x0} 0 L ${x1} 0 L ${x1} ${leadY} `;

        for (let j = LANES; j >= 0; j--) {
          const u = j / LANES;
          const x = x0 + (x1 - x0) * u;
          const s = state[j];

          const wobble =
            (Math.sin(t1 + u * 9.0 + s.a) + 0.65 * Math.sin(t2 + u * 17.0 + s.b))
            * WOBBLE_PX * s.amp * (0.35 + 0.75 * env);

          const p1 = (Math.sin(ts * 0.0023 + idBase + j * 1.37) + 1) * 0.5;
          const p2 = (Math.sin(ts * 0.0047 + idBase + j * 2.11) + 1) * 0.5;
          const pulse = Math.pow(0.55 * p1 + 0.45 * p2, s.bias);

          const drip = pulse * DRIP_PX * env * s.amp;
          const target = clamp(leadY + wobble + drip, 0, 1000);

          const f = 1 - Math.exp(-dt * s.lag);
          s.y += (target - s.y) * f;

          d += `L ${x} ${clamp(s.y, 0, 1000)} `;
        }

        d += `L ${x0} 0 Z`;
        return d;
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        const y = window.scrollY || window.pageYOffset || 0;
        const raw = clamp((y - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);

        const f = 1 - Math.exp(-dt * FRONT_FOLLOW);
        smoothP += (raw - smoothP) * f;

        leftPath.setAttribute('d', buildColumnPath(LEFT_CENTER_X, HALF_WIDTH, leftState, ts, dt, smoothP, 1000));
        rightPath.setAttribute('d', buildColumnPath(RIGHT_CENTER_X, HALF_WIDTH, rightState, ts, dt, smoothP, 2000));

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
