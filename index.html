<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
</head>
<body style="margin:0;background:#000;min-height:320vh;">

  <!-- Base image (always visible, fixed/static) -->
  <div style="
    position:fixed;
    inset:0;
    background:url('./base.png') center top / cover no-repeat;
    z-index:0;
  "></div>

  <!-- Bleed image overlay (revealed by wipe) -->
  <div id="bleedWrap" style="
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
  ">
    <div id="bleedLayer" style="
      position:absolute;
      inset:0;
      background:url('./bleed.png') center top / cover no-repeat;
      clip-path: inset(100% 0 0 0); /* fully hidden at load */
      will-change: clip-path;
    "></div>
  </div>

  <script>
    // Tune these if needed
    const HEADER_HEIGHT = 230; // wipe starts after this scroll amount
    const WIPE_RANGE = 1400;   // scroll distance from hidden -> fully shown

    const bleedLayer = document.getElementById('bleedLayer');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function update() {
      const y = window.scrollY || window.pageYOffset || 0;

      // Start only after header is no longer fully visible
      const pastTrigger = Math.max(0, y - HEADER_HEIGHT);
      const progress = clamp(pastTrigger / WIPE_RANGE, 0, 1);

      // Top-to-bottom wipe reveal:
      // progress 0 => inset(100% 0 0 0) hidden
      // progress 1 => inset(0% 0 0 0) fully visible
      const hiddenBottom = (1 - progress) * 100;
      bleedLayer.style.clipPath = `inset(0 0 ${hiddenBottom}% 0)`;

      requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
