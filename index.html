<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden;
    }

    .scroll-runway { height: 430vh; }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    #headShell {
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }

    .headLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
    }

    #baseLayer { z-index: 1; }

    #bleedLayer {
      z-index: 2;
      /* important: both prefixed and unprefixed */
      -webkit-mask: url(#oozeMask);
      mask: url(#oozeMask);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-position: 0 0;
      mask-position: 0 0;
      will-change: -webkit-mask, mask;
    }

    /* hidden svg defs host */
    #maskDefs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <!-- inline SVG defs for robust mask refs -->
  <svg id="maskDefs" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <mask id="oozeMask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
        <rect x="0" y="0" width="1" height="1" fill="black"></rect>
        <path id="oozePath" d="M0 0 L1 0 L1 0 L0 0 Z" fill="white"></path>
      </mask>
    </defs>
  </svg>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <img id="baseLayer" class="headLayer" src="./head-base.png" alt="" />
      <img id="bleedLayer" class="headLayer" src="./head-bleed.png" alt="" />
    </div>
  </div>

  <script>
    const oozePath = document.getElementById('oozePath');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    const WIPE_START_PX = 0;
    const WIPE_RANGE_PX = 1700;
    const START_Y_FRAC = 0.1; // eyes area

    const COLS = 60;
    const MAX_WOBBLE = 0.020;   // in bbox units
    const DRIP_DEPTH = 0.100;   // in bbox units
    const FRONT_SMOOTH = 10;
    const COLUMN_LAG = 16;

    let smoothP = 0;
    let lastTs = 0;
    const colY = Array.from({ length: COLS + 1 }, () => START_Y_FRAC);

    function buildPath(progress, ts, dt) {
      const leadY = START_Y_FRAC + progress * (1 - START_Y_FRAC);
      const t1 = ts * 0.0011;
      const t2 = ts * 0.0019;

      let d = `M 0 0 L 1 0 L 1 ${leadY} `;

      for (let i = COLS; i >= 0; i--) {
        const u = i / COLS;

        const centerWeight = 1 - Math.abs(u - 0.5) * 1.35;
        const w = clamp(centerWeight, 0.2, 1.0);

        const wobble =
          (Math.sin(t1 + u * 11.0) + 0.55 * Math.sin(t2 + u * 19.0))
          * MAX_WOBBLE * (0.45 + 0.55 * Math.sin(Math.PI * progress));

        const dripWave =
          Math.sin(t1 * 0.9 + u * 24.0) * 0.5 +
          Math.sin(t2 * 1.1 + u * 41.0) * 0.5;

        const drip01 = Math.pow((dripWave + 1) * 0.5, 1.8);
        const dripEnvelope = Math.sin(Math.PI * clamp(progress, 0, 1));
        const drip = drip01 * DRIP_DEPTH * dripEnvelope * w;

        const target = clamp(leadY + wobble + drip, 0, 1);

        const follow = 1 - Math.exp(-dt * COLUMN_LAG);
        colY[i] += (target - colY[i]) * follow;

        d += `L ${u} ${clamp(colY[i], 0, 1)} `;
      }

      d += `L 0 0 Z`;
      return d;
    }

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const scrollY = window.scrollY || window.pageYOffset || 0;
      const raw = clamp((scrollY - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);

      const follow = 1 - Math.exp(-dt * FRONT_SMOOTH);
      smoothP += (raw - smoothP) * follow;

      oozePath.setAttribute('d', buildPath(smoothP, ts, dt));
      requestAnimationFrame(tick);
    }

    oozePath.setAttribute('d', `M0 0 L1 0 L1 ${START_Y_FRAC} L0 ${START_Y_FRAC} Z`);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
