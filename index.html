<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    :root {
      --bg: #000;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      overflow-x: hidden;
    }

    /* long page so scrolling exists */
    .scroll-runway {
      height: 420vh;
    }

    /* fixed full-screen stage */
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      background: #000;
    }

    /* background image */
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* locked head pair container */
    #headShell {
      position: absolute;
      left: 50%;
      top: 0;                            /* anchored to top of page */
      width: min(1800px, 125vw);         /* very large */
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      transform-origin: top center;
      z-index: 2;
    }

    #headSvg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">
        <defs>
          <clipPath id="bleedClip" clipPathUnits="userSpaceOnUse">
            <!-- animated downward wipe -->
            <rect id="wipeRect" x="0" y="0" width="1000" height="0"></rect>
          </clipPath>
        </defs>

        <!-- base and bleed are perfectly locked: same group, same coords -->
        <g id="headGroup">
          <image
            href="./head-base.png"
            xlink:href="./head-base.png"
            x="0" y="0" width="1000" height="1000"
            preserveAspectRatio="xMidYMin meet"></image>

          <image
            href="./head-bleed.png"
            xlink:href="./head-bleed.png"
            x="0" y="0" width="1000" height="1000"
            preserveAspectRatio="xMidYMin meet"
            clip-path="url(#bleedClip)"></image>
        </g>
      </svg>
    </div>
  </div>

  <script>
    const wipeRect = document.getElementById('wipeRect');

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // Scroll range controlling full wipe progress
    const WIPE_START_PX = 0;      // starts immediately when scrolling
    const WIPE_RANGE_PX = 1800;   // how many px of scroll to fully reveal bleed

    let smooth = 0;
    let lastTs = 0;

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const scrollY = window.scrollY || window.pageYOffset || 0;

      const raw = clamp((scrollY - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);

      // smoothing so animation feels fluid
      const follow = 1 - Math.exp(-dt * 10);
      smooth += (raw - smooth) * follow;

      // downward wipe: reveal top->bottom
      wipeRect.setAttribute('height', String(1000 * smooth));

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
