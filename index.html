<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
</head>
<body style="margin:0;background:#000;min-height:380vh;overflow-x:hidden;">

  <!-- Base image -->
  <div style="
    position:fixed;
    inset:0;
    background:url('./base.png') center top / cover no-repeat;
    z-index:0;
  "></div>

  <!-- Bleed image -->
  <div id="bleedLayer" style="
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:url('./bleed.png') center top / cover no-repeat;
    clip-path:url(#dualEyeReveal);
    -webkit-clip-path:url(#dualEyeReveal);
  "></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="dualEyeReveal" clipPathUnits="objectBoundingBox">
        <path id="leftEyePath" d="M0 0 L0 0 Z"></path>
        <path id="rightEyePath" d="M0 0 L0 0 Z"></path>
      </clipPath>
    </defs>
  </svg>

  <script>
    const HEADER_HEIGHT = 230;
    const WIPE_RANGE = 1800;

    // Keep your requested update:
    const LEFT_INNER_X  = 0.495;
    const RIGHT_INNER_X = 0.53;

    const leftPath = document.getElementById('leftEyePath');
    const rightPath = document.getElementById('rightEyePath');

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a,b,t) => a + (b-a)*t;
    const q = (v, step=0.0012) => Math.round(v / step) * step; // quantize to reduce shimmer

    let smoothP = 0;

    const L_COUNT = 10;
    const R_COUNT = 10;

    const leftPulse  = Array.from({length:L_COUNT}, (_,i)=>({amp:0, seed:i*1.37+0.3}));
    const rightPulse = Array.from({length:R_COUNT}, (_,i)=>({amp:0, seed:i*1.91+0.8}));

    // Persistent lane smoothing buffers (big anti-flicker fix)
    const leftLaneY  = Array.from({length:L_COUNT+1}, () => 0);
    const rightLaneY = Array.from({length:R_COUNT+1}, () => 0);

    function updatePulses(arr, p, dtFrames) {
      for (const a of arr) {
        const burstChance = 0.0012 + 0.0026 * Math.sin(p * Math.PI);
        if (Math.random() < burstChance * dtFrames) {
          a.amp = Math.max(a.amp, 0.06 + Math.random() * 0.16);
        }
        // gentler decay = less snapping
        a.amp *= Math.pow(0.992, dtFrames);
      }
    }

    function buildEyePath(xStart, dir, y, width, t, pulses, laneCount, laneBuffer, dt) {
      const xEnd = clamp(xStart + dir * width, 0, 1);
      const pts = [];

      // lower frequency wobble to avoid bottom-tip glitching
      const t1 = t * 0.0014;
      const t2 = t * 0.0022;

      for (let i = 0; i <= laneCount; i++) {
        const u = i / laneCount;
        const x = lerp(xStart, xEnd, u);
        const innerWeight = (1 - u);

        const baseDepth = y + innerWeight * 0.26 + (1-innerWeight) * 0.10;

        const wobble =
          Math.sin(t1 + i * 1.07) * (0.006 + innerWeight * 0.006) +
          Math.sin(t2 + i * 1.83) * 0.004;

        const pulse = (pulses[i % pulses.length].amp || 0) * (0.55 + innerWeight * 0.65);

        let targetY = clamp(baseDepth + wobble + pulse, 0, 1);

        // smooth each lane independently (strong anti-jitter)
        const laneFollow = 1 - Math.exp(-dt * 18);
        laneBuffer[i] += (targetY - laneBuffer[i]) * laneFollow;

        // quantize after smoothing to avoid subpixel shimmer
        const yy = q(laneBuffer[i], 0.0012);

        pts.push({x, y:yy});
      }

      // very subtle sway only
      const sway = Math.sin(t * 0.0008) * 0.0035;
      for (const p of pts) p.x = clamp(q(p.x + sway * dir, 0.0009), 0, 1);

      let d = `M ${xStart} 0 L ${xEnd} 0 L ${pts[pts.length-1].x} ${pts[pts.length-1].y} `;
      for (let i = pts.length - 2; i >= 0; i--) {
        const p0 = pts[i+1], p1 = pts[i];
        const cx1 = q(lerp(p0.x, p1.x, 0.38), 0.0009);
        const cy1 = q(p0.y, 0.0012);
        const cx2 = q(lerp(p0.x, p1.x, 0.62), 0.0009);
        const cy2 = q(p1.y, 0.0012);
        d += `C ${cx1} ${cy1}, ${cx2} ${cy2}, ${p1.x} ${p1.y} `;
      }
      d += `L ${xStart} 0 Z`;
      return d;
    }

    let lastTs = 0;
    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const s = window.scrollY || window.pageYOffset || 0;
      const rawPast = Math.max(0, s - HEADER_HEIGHT);
      const rawP = clamp(rawPast / WIPE_RANGE, 0, 1);

      const follow = 1 - Math.exp(-dt * 7.0);
      smoothP += (rawP - smoothP) * follow;

      const y = -0.30 + (1.42 * smoothP);

      const maxLeftWidth  = 0.24;
      const maxRightWidth = 0.24;
      const eyeOpen = Math.pow(smoothP, 0.85);
      const leftWidth = maxLeftWidth * eyeOpen;
      const rightWidth = maxRightWidth * eyeOpen;

      const dtFrames = dt * 60;
      updatePulses(leftPulse, smoothP, dtFrames);
      updatePulses(rightPulse, smoothP, dtFrames);

      const leftD = buildEyePath(
        LEFT_INNER_X, -1, y, leftWidth, ts,
        leftPulse, L_COUNT, leftLaneY, dt
      );
      const rightD = buildEyePath(
        RIGHT_INNER_X, +1, y, rightWidth, ts,
        rightPulse, R_COUNT, rightLaneY, dt
      );

      leftPath.setAttribute('d', leftD);
      rightPath.setAttribute('d', rightD);

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
