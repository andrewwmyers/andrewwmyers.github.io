<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinned Head + Bleed</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      overflow-x: hidden;
    }

    .scroll-runway { height: 560vh; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      background: #000;
    }

    #bgLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Absolute horizontal lock */
    #headShell {
      position: absolute;
      left: 50%;
      top: 0; /* set once in JS */
      width: 1000px;
      height: 1000px;
      transform: translateX(-50%);
      transform-origin: top center;
      z-index: 2;
      will-change: transform;
    }

    #headSvg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bgLayer" src="./bg-base.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">
        <defs>
          <clipPath id="dripClip" clipPathUnits="userSpaceOnUse">
            <path id="leftClip" d=""></path>
            <path id="rightClip" d=""></path>
          </clipPath>
        </defs>

        <g id="headScroll" transform="translate(0,0)">
          <image id="headBase"
                 href="./head-base.png" xlink:href="./head-base.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"></image>

          <image id="headBleed"
                 href="./head-bleed.png" xlink:href="./head-bleed.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"
                 clip-path="url(#dripClip)"></image>
        </g>
      </svg>
    </div>
  </div>
