<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers – Floating Head</title>
  <style>
    html, body { margin:0; background:#000; overflow-x:hidden; }

    /* Total scroll duration */
    .scroll-runway { height: 520vh; position: relative; }

    /* Pinned stage */
    #stage{
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      background: #000;
    }

    /*
      Background: always fill viewport, no black side/bottom borders.
      (May crop some bg content, which is usually acceptable for background layer.)
    */
    #bgLayer{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      object-position:center top;
      will-change:transform;
      z-index:1;
      user-select:none; -webkit-user-drag:none;
    }

    /*
      Head system: no vertical crop (meet) so bleed can fully travel.
      This may leave transparent side gutters in the head layer itself,
      but bg behind it is fully filled, so no black borders.
    */
    #headSvg{
      position:absolute; inset:0;
      width:100%; height:100%;
      z-index:2;
      overflow:visible;
      will-change:transform;
    }
  </style>
</head>

  <div id="stage">

        <image id="headBase"

    </svg>
