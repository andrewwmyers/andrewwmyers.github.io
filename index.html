<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Head + Bleed</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      overflow-x: hidden;
    }

    /* Long enough for full bleed progression */
    .scroll-runway { height: 560vh; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      background: #000;
    }

    /* Background always fills screen (no side/bottom black border) */
    #bgLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Head system */
    #headSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: visible;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bgLayer" src="./bg-base.png" alt="">

    <svg id="headSvg"
         viewBox="0 0 1000 1000"
         preserveAspectRatio="xMidYMin meet"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         aria-hidden="true">
      <defs>
        <!-- userSpaceOnUse = reliable animated path reveal -->
        <clipPath id="dripClip" clipPathUnits="userSpaceOnUse">
          <path id="leftClip" d=""></path>
          <path id="rightClip" d=""></path>
        </clipPath>
      </defs>

      <!-- One shared transform group => base + bleed stay perfectly locked -->
      <g id="headGroup" transform="translate(0,0)">
        <!-- Scaled head container -->
        <g id="headScaleGroup" transform="translate(500 0) scale(1.22) translate(-500 0)">
          <image id="headBase"
                 href="./head-base.png"
                 xlink:href="./head-base.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"></image>

          <image id="headBleed"
                 href="./head-bleed.png"
                 xlink:href="./head-bleed.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"
                 clip-path="url(#dripClip)"></image>
        </g>
      </g>
    </svg>
  </div>

  <script>
    // =========================
    // Tunables
    // =========================

    // Height of white header area as fraction of viewport
    const WHITE_HEADER_FRAC = 0.14;

    // Make head bigger (1.0 = original)
    const HEAD_SCALE = 1.22;

    // Bleed timing
    const BLEED_START_DELAY_VH = 0.00;
    const WIPE_RANGE_VH = 1.35;   // duration of bleed scroll segment

    // Bleed progression (0..1 in image space)
    const BLEED_START_Y = 0.18;
    const BLEED_TRAVEL  = 0.99;   // reaches near bottom => "all the way down"

    // Eye positions (normalized x)
    const LEFT_INNER_X  = 0.495;
    const RIGHT_INNER_X = 0.53;

    // Spread and drip style
    const MAX_LEFT_WIDTH  = 0.30;
    const MAX_RIGHT_WIDTH = 0.30;
    const DRIP_HALF_WIDTH = 0.012;
    const L_COUNT = 14;
    const R_COUNT = 14;

    // =========================
    const bgLayer = document.getElementById('bgLayer');
    const headGroup = document.getElementById('headGroup');
    const headScaleGroup = document.getElementById('headScaleGroup');
    const leftClip = document.getElementById('leftClip');
    const rightClip = document.getElementById('rightClip');

    // apply tunable scale once
    headScaleGroup.setAttribute(
      'transform',
      `translate(500 0) scale(${HEAD_SCALE}) translate(-500 0)`
    );

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp  = (a, b, t) => a + (b - a) * t;

    let smoothP = 0;
    let lastTs = 0;

    const leftLaneY  = Array.from({ length: L_COUNT + 1 }, () => 0);
    const rightLaneY = Array.from({ length: R_COUNT + 1 }, () => 0);

    // headSvg uses meet; rendered head height is min(vw, vh)
    function getHeadRenderedHeightPx() {
      const vw = window.innerWidth || 1;
      const vh = window.innerHeight || 1;
      return Math.min(vw, vh);
    }

    function buildDripRects(xStart, dir, y, width, t, laneCount, dt, laneBuf) {
      const xEnd = clamp(xStart + dir * width, 0, 1);
      const t1 = t * 0.0013;
      const t2 = t * 0.0020;
      let d = "";

      for (let i = 0; i <= laneCount; i++) {
        const u = i / laneCount;
        const w = 1 - u;
        const x = lerp(xStart, xEnd, u);

        const baseDepth = y + w * 0.28 + (1 - w) * 0.10;
        const wobble =
          Math.sin(t1 + i * 1.05) * (0.006 + w * 0.007) +
          Math.sin(t2 + i * 1.81) * 0.004;

        const targetY = clamp(baseDepth + wobble, 0, 1);
        const follow = 1 - Math.exp(-dt * 18);
        laneBuf[i] += (targetY - laneBuf[i]) * follow;

        const yy = clamp(laneBuf[i], 0, 1);

        // userSpaceOnUse => convert to 1000x1000 coords
        const xl = clamp(x - DRIP_HALF_WIDTH, 0, 1) * 1000;
        const xr = clamp(x + DRIP_HALF_WIDTH, 0, 1) * 1000;
        const yb = yy * 1000;

        d += `M ${xl} 0 L ${xr} 0 L ${xr} ${yb} L ${xl} ${yb} Z `;
      }

      return d;
    }

    function render(ts) {
      const now = ts || performance.now();
      const dt = lastTs ? Math.min(0.05, (now - lastTs) / 1000) : (1 / 60);
      lastTs = now;

      const scrollY = window.scrollY || window.pageYOffset || 0;
      const vh = window.innerHeight || 1;

      // 1) Pre-lock scroll (until white header gone)
      const lockPx = WHITE_HEADER_FRAC * vh;
      const offsetPx = -Math.min(scrollY, lockPx);

      // bg scrolls then locks
      bgLayer.style.transform = `translate3d(0, ${offsetPx}px, 0)`;

      // head group scrolls then locks (same phase)
      const headH = getHeadRenderedHeightPx();
      const vbOffset = (offsetPx / headH) * 1000;
      headGroup.setAttribute('transform', `translate(0 ${vbOffset})`);

      // 2) Bleed starts after lock
      const pastTrigger = Math.max(0, scrollY - lockPx - (BLEED_START_DELAY_VH * vh));
      const rawP = clamp(pastTrigger / (WIPE_RANGE_VH * vh), 0, 1);

      const follow = 1 - Math.exp(-dt * 7.0);
      smoothP += (rawP - smoothP) * follow;

      const y = BLEED_START_Y + (BLEED_TRAVEL * smoothP);
      const open = Math.pow(smoothP, 0.85);

      const lw = MAX_LEFT_WIDTH * open;
      const rw = MAX_RIGHT_WIDTH * open;

      leftClip.setAttribute('d', buildDripRects(
        LEFT_INNER_X, -1, y, lw, now, L_COUNT, dt, leftLaneY
      ));
      rightClip.setAttribute('d', buildDripRects(
        RIGHT_INNER_X, +1, y, rw, now, R_COUNT, dt, rightLaneY
      ));
    }

    function tick(ts) {
      render(ts);
      requestAnimationFrame(tick);
    }

    render(performance.now());
    requestAnimationFrame(tick);
    window.addEventListener('scroll', () => render(performance.now()), { passive: true });
    window.addEventListener('resize', () => render(performance.now()));
  </script>
</body>
</html>
