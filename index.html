<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height: 520vh; }

    #stage{
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    #headShell{
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }

    #headSvg{
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">

        <defs>
          <mask id="oozeMaskLeft" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathLeft" d="M0 0 Z" fill="white"></path>
          </mask>

          <mask id="oozeMaskRight" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathRight" d="M0 0 Z" fill="white"></path>
          </mask>
        </defs>

        <image href="./head-base.png" xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskLeft)"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskRight)"></image>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const leftPath = document.getElementById('oozePathLeft');
      const rightPath = document.getElementById('oozePathRight');
      if (!leftPath || !rightPath) return;

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const smoothstep = (t) => t * t * (3 - 2 * t);

      // Locked baseline
      const START_Y_FRAC = 0.045;

      // Scroll timing
      const WIPE_START_PX = 0;
      const WIPE_RANGE_PX = 6200;

      // Pre-drop (must happen every cycle)
      const PREDROP_SCROLL_PX = 200;
      const PREDROP_DISTANCE_PX = 210;

      // Slow handoff after pre-drop (prevents snap)
      const HANDOFF_SCROLL_PX = 900;   // longer handoff = smoother
      const HANDOFF_STRENGTH = 0.08;   // very damp right after pre-drop

      // Eye columns
      const LEFT_CENTER_X  = 455;
      const RIGHT_CENTER_X = 545;
      const HALF_WIDTH = 46;

      // Drip style
      const LANES = 22;
      const WOBBLE_PX = 4;
      const DRIP_PX = 210;

      // Follow speeds (separate down vs up so retract is smooth and complete)
      const FOLLOW_DOWN = 1.45;     // slower descent
      const FOLLOW_UP = 2.6;        // quicker retraction, still smooth
      const FOLLOW_TOP_BOOST = 1.8; // extra retract near very top

      // Early intensity shaping
      const EARLY_DRIP_BOOST = 1.25;
      const EARLY_WOBBLE_BOOST = 1.05;
      const POST_PREDROP_HOLD = 0.10;
      const EARLY_FADE_SPAN = 0.24;

      // No render before first scroll
      let started = false;
      let lastTs = 0;
      let prevTarget = 0;

      function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      function makeState(seed) {
        return Array.from({ length: LANES + 1 }, (_, i) => ({
          y: 0, // starts invisible
          a: hash(seed + i * 2.3) * Math.PI * 2,
          b: hash(seed + i * 3.1) * Math.PI * 2,
          amp: 0.72 + 0.60 * hash(seed + i * 4.9),
          bias: 1.45 + 1.10 * hash(seed + i * 6.7)
        }));
      }

      const leftState = makeState(10);
      const rightState = makeState(90);

      function clearMasks() {
        leftPath.setAttribute('d', 'M0 0 Z');
        rightPath.setAttribute('d', 'M0 0 Z');
      }

      function earlyStrength(rawProgress, preT) {
        if (preT < 1) return 1;
        const held = rawProgress - POST_PREDROP_HOLD;
        if (held <= 0) return 1;
        const k = clamp(held / EARLY_FADE_SPAN, 0, 1);
        return 1 - smoothstep(k);
      }

      function buildPath(centerX, halfW, state, ts, dt, data, idBase, followRate) {
        const { totalProgress, rawProgress, preT } = data;

        // Truly invisible when at top target
        if (totalProgress <= 0.000001) return 'M0 0 Z';

        const x0 = clamp(centerX - halfW, 0, 1000);
        const x1 = clamp(centerX + halfW, 0, 1000);

        const leadY = totalProgress * 1000; // includes start frac + predrop + main

        const env = 0.16 + 0.84 * Math.sin(Math.PI * clamp(rawProgress, 0, 1));

        const e = earlyStrength(rawProgress, preT);
        const earlyDripMult = 1 + EARLY_DRIP_BOOST * e;
        const earlyWobbleMult = 1 + EARLY_WOBBLE_BOOST * e;

        const t1 = ts * 0.00036;
        const t2 = ts * 0.00064;

        const pts = [];
        for (let j = 0; j <= LANES; j++) {
          const u = j / LANES;
          const x = x0 + (x1 - x0) * u;
          const s = state[j];

          const wobble =
            (Math.sin(t1 + u * 6.5 + s.a) + 0.34 * Math.sin(t2 + u * 11.0 + s.b))
            * WOBBLE_PX * earlyWobbleMult * s.amp * (0.30 + 0.60 * env);

          const p1 = (Math.sin(ts * 0.00072 + idBase + j * 1.07) + 1) * 0.5;
          const p2 = (Math.sin(ts * 0.00120 + idBase + j * 1.71) + 1) * 0.5;
          const pulse = Math.pow(0.68 * p1 + 0.32 * p2, s.bias);

          const drip = pulse * DRIP_PX * env * earlyDripMult * s.amp;
          const targetY = clamp(leadY + wobble + drip, 0, 1000);

          const f = 1 - Math.exp(-dt * followRate);
          s.y += (targetY - s.y) * f;

          pts.push({ x, y: clamp(s.y, 0, 1000) });
        }

        let d = `M ${x0} 0 L ${x1} 0 L ${pts[LANES].x} ${pts[LANES].y} `;
        for (let j = LANES - 1; j >= 0; j--) {
          const p = pts[j + 1];
          const n = pts[j];
          d += `Q ${p.x} ${p.y} ${(p.x + n.x) * 0.5} ${(p.y + n.y) * 0.5} `;
        }
        d += `L ${x0} 0 Z`;
        return d;
      }

      function computeProgress(y) {
        // Pre-drop 0..1
        const preT = clamp((y - WIPE_START_PX) / PREDROP_SCROLL_PX, 0, 1);
        const preEase = smoothstep(preT);
        const preDrop = (PREDROP_DISTANCE_PX / 1000) * preEase;

        // Main raw
        const raw = clamp((y - WIPE_START_PX - PREDROP_SCROLL_PX) / WIPE_RANGE_PX, 0, 1);

        // Slow handoff after predrop
        const hT = clamp((y - WIPE_START_PX - PREDROP_SCROLL_PX) / HANDOFF_SCROLL_PX, 0, 1);
        const hEase = smoothstep(hT);
        const damp = HANDOFF_STRENGTH + (1 - HANDOFF_STRENGTH) * hEase;
        const shapedRaw = raw * damp;

        // Base lead with start frac
        const base = START_Y_FRAC + shapedRaw * (1 - START_Y_FRAC);

        // Total includes predrop distance
        const total = clamp(base + preDrop, 0, 1);

        // Keep strictly invisible exactly at top
        if (y <= WIPE_START_PX + 0.5) {
          return { totalProgress: 0, rawProgress: 0, preT: 0 };
        }

        return { totalProgress: total, rawProgress: raw, preT };
      }

      clearMasks();

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        const y = window.scrollY || window.pageYOffset || 0;

        if (!started && y <= WIPE_START_PX + 1) {
          clearMasks();
          requestAnimationFrame(tick);
          return;
        }
        if (y > WIPE_START_PX + 1) started = true;

        const p = computeProgress(y);

        // Direction-aware follow
        const goingUp = p.totalProgress < prevTarget;
        prevTarget = p.totalProgress;

        // Extra retraction help near top, smooth not hard
        const topN = 1 - clamp((y - WIPE_START_PX) / 220, 0, 1);
        const topBoost = 1 + (FOLLOW_TOP_BOOST - 1) * smoothstep(topN);

        const followRate = goingUp ? (FOLLOW_UP * topBoost) : FOLLOW_DOWN;

        const ld = buildPath(LEFT_CENTER_X, HALF_WIDTH, leftState, ts, dt, p, 1000, followRate);
        const rd = buildPath(RIGHT_CENTER_X, HALF_WIDTH, rightState, ts, dt, p, 2000, followRate);

        leftPath.setAttribute('d', ld);
        rightPath.setAttribute('d', rd);

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
