<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostic Starter (3 Assets)</title>
  <style>
    :root{
      --bg: #000;
      --guide-header-frac: 0.14; /* visual guide only */
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      overflow-x: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .scroll-runway { height: 400vh; }

    #stage{
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bgLayer{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 1;
    }

    /* Locked head container */
    #headShell{
      position: absolute;
      left: 50%;
      top: 120px;                 /* set in JS once */
      width: 1000px;
      height: 1000px;
      transform: translateX(-50%) scale(1); /* set in JS once */
      transform-origin: top center;
      z-index: 2;
      pointer-events: none;
    }

    #headSvg{
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Debug overlay */
    #debug{
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .v-center, .h-header, .head-box{
      position: absolute;
      pointer-events: none;
    }
    .v-center{
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,255,255,0.75);
      transform: translateX(-0.5px);
    }
    .h-header{
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255,255,0,0.85);
      top: calc(var(--guide-header-frac) * 100vh);
    }
    .head-box{
      border: 1px dashed rgba(255,0,255,0.9);
      box-sizing: border-box;
    }

    /* Minimal control panel for diagnostics */
    #panel{
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      pointer-events: auto;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(4px);
      min-width: 250px;
    }
    #panel label{
      display: block;
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 6px;
    }
    #panel input[type="range"]{
      width: 100%;
    }
    #panel .row{
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    #panel button{
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.08);
      color: #fff;
      cursor: pointer;
    }
    #panel code{
      font-size: 11px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <!-- 1) New background asset -->
    <img id="bgLayer" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">
        <defs>
          <clipPath id="dripClip" clipPathUnits="userSpaceOnUse">
            <path id="leftClip" d=""></path>
            <path id="rightClip" d=""></path>
          </clipPath>
        </defs>

        <!-- Shared group ensures base+bleed stay perfectly locked -->
        <g id="headGroup" transform="translate(0,0)">
          <!-- 2) Base head -->
          <image id="headBase"
                 href="./head-base.png"
                 xlink:href="./head-base.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"></image>

          <!-- 3) Bleed head (masked) -->
          <image id="headBleed"
                 href="./head-bleed.png"
                 xlink:href="./head-bleed.png"
                 x="0" y="0" width="1000" height="1000"
                 preserveAspectRatio="xMidYMin meet"
                 clip-path="url(#dripClip)"></image>
        </g>
      </svg>
    </div>
  </div>

  <div id="debug">
    <div class="v-center"></div>
    <div class="h-header"></div>
    <div id="headBox" class="head-box"></div>
  </div>

  <div id="panel">
    <label for="bleedRange">Bleed Reveal (diagnostic): <code id="bleedVal">0.00</code></label>
    <input id="bleedRange" type="range" min="0" max="1" step="0.001" value="0" />
    <div class="row">
      <button id="toggleGuides">Toggle Guides</button>
      <button id="resetBleed">Reset Bleed</button>
    </div>
  </div>

  <script>
    // ---------- Layout calibration (one-time) ----------
    const WHITE_HEADER_FRAC = 0.00;
    const HEAD_WIDTH_FRAC   = 1.12;
    const HEAD_MIN_PX       = 980;
    const HEAD_MAX_PX       = 1800;

    // Bleed geometry
    const BLEED_START_Y = 0.18;
    const BLEED_TRAVEL  = 0.99;
    const LEFT_INNER_X  = 0.495;
    const RIGHT_INNER_X = 0.53;
    const MAX_LEFT_WIDTH  = 0.30;
    const MAX_RIGHT_WIDTH = 0.30;
    const DRIP_HALF_WIDTH = 0.012;
    const L_COUNT = 14, R_COUNT = 14;

    const headShell = document.getElementById('headShell');
    const leftClip = document.getElementById('leftClip');
    const rightClip = document.getElementById('rightClip');
    const headBox = document.getElementById('headBox');

    const bleedRange = document.getElementById('bleedRange');
    const bleedVal = document.getElementById('bleedVal');
    const toggleGuidesBtn = document.getElementById('toggleGuides');
    const resetBleedBtn = document.getElementById('resetBleed');
    const debugLayer = document.getElementById('debug');

    const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
    const lerp  = (a,b,t)=>a+(b-a)*t;

    // Freeze at initial viewport (diagnostic intent)
    const initW = document.documentElement.clientWidth || window.innerWidth || 1;
    const initH = document.documentElement.clientHeight || window.innerHeight || 1;

    const frozenTopPx = WHITE_HEADER_FRAC * initH;
    const frozenHeadPx = clamp(initW * HEAD_WIDTH_FRAC, HEAD_MIN_PX, HEAD_MAX_PX);
    const frozenScale = frozenHeadPx / 1000;

    headShell.style.top = `${frozenTopPx}px`;
    headShell.style.transform = `translateX(-50%) scale(${frozenScale})`;

    function drawHeadBox(){
      const rect = headShell.getBoundingClientRect();
      headBox.style.left = `${rect.left}px`;
      headBox.style.top = `${rect.top}px`;
      headBox.style.width = `${rect.width}px`;
      headBox.style.height = `${rect.height}px`;
    }

    function buildDripRects(xStart, dir, y, width, t, laneCount){
      const xEnd = clamp(xStart + dir * width, 0, 1);
      const t1 = t * 0.0013;
      const t2 = t * 0.0020;
      let d = "";

      for(let i=0;i<=laneCount;i++){
        const u = i/laneCount;
        const w = 1-u;
        const x = lerp(xStart, xEnd, u);

        const baseDepth = y + w*0.28 + (1-w)*0.10;
        const wobble =
          Math.sin(t1 + i*1.05) * (0.006 + w*0.007) +
          Math.sin(t2 + i*1.81) * 0.004;

        const yy = clamp(baseDepth + wobble, 0, 1);
        const xl = clamp(x - DRIP_HALF_WIDTH, 0, 1) * 1000;
        const xr = clamp(x + DRIP_HALF_WIDTH, 0, 1) * 1000;
        const yb = yy * 1000;

        d += `M ${xl} 0 L ${xr} 0 L ${xr} ${yb} L ${xl} ${yb} Z `;
      }
      return d;
    }

    function renderBleed(p){
      const t = performance.now();
      const y = BLEED_START_Y + BLEED_TRAVEL * p;
      const open = Math.pow(p, 0.85);

      leftClip.setAttribute('d', buildDripRects(
        LEFT_INNER_X, -1, y, MAX_LEFT_WIDTH * open, t, L_COUNT
      ));
      rightClip.setAttribute('d', buildDripRects(
        RIGHT_INNER_X, +1, y, MAX_RIGHT_WIDTH * open, t, R_COUNT
      ));

      bleedVal.textContent = Number(p).toFixed(2);
    }

    // Diagnostic UI
    bleedRange.addEventListener('input', () => {
      renderBleed(Number(bleedRange.value));
    });

    toggleGuidesBtn.addEventListener('click', () => {
      debugLayer.style.display = (debugLayer.style.display === 'none') ? 'block' : 'none';
    });

    resetBleedBtn.addEventListener('click', () => {
      bleedRange.value = 0;
      renderBleed(0);
    });

    // keep bleed "alive" slightly for visual wobble while paused
    function tick(){
      renderBleed(Number(bleedRange.value));
      drawHeadBox();
      requestAnimationFrame(tick);
    }

    renderBleed(0);
    drawHeadBox();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
