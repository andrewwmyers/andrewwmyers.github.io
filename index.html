<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; background:#000; overflow-x:hidden; }
  </style>
</head>
<body>
  <!-- Longer runway so we never run out of page before bleed completes -->
  <div style="height:520vh;"></div>

  <!-- Unified scene: base + bleed in same SVG (always perfectly locked) -->
  <svg id="scene"
       viewBox="0 0 1000 1000"
       preserveAspectRatio="xMidYMin slice"
       style="position:fixed; inset:0; width:100%; height:100%; display:block; pointer-events:none; z-index:1;">
    <defs>
      <clipPath id="dripClip" clipPathUnits="userSpaceOnUse">
        <path id="leftClip" d=""></path>
        <path id="rightClip" d=""></path>
      </clipPath>
    </defs>

    <g id="imgGroup" transform="translate(0,0)">
      <image id="baseImg"
             href="./base.png"
             x="0" y="0" width="1000" height="1000"
             preserveAspectRatio="xMidYMin slice"></image>

      <image id="bleedImg"
             href="./bleed.png"
             x="0" y="0" width="1000" height="1000"
             preserveAspectRatio="xMidYMin slice"
             clip-path="url(#dripClip)"></image>
    </g>
  </svg>

  <script>
    // --------------------------------
    // MAIN GOAL: bleed completes before page ends
    // --------------------------------

    // Confirmed correct by you
    const WHITE_HEADER_FRAC = 0.14;

    // Start bleed immediately after header lock
    const BLEED_START_DELAY_VH = 0.00;

    // Smaller = faster completion (so it finishes before page end)
    const WIPE_RANGE_VH = 1.45;

    // Bleed shape / motion
    const BLEED_START_Y = 0.20;
    const BLEED_TRAVEL  = 0.94;

    // Eye alignment
    const LEFT_INNER_X  = 0.495;
    const RIGHT_INNER_X = 0.53;

    // Spread from inner eye edges
    const MAX_LEFT_WIDTH  = 0.24;
    const MAX_RIGHT_WIDTH = 0.24;

    // Thickness of each drip ribbon
    const DRIP_HALF_WIDTH = 0.010;

    // --------------------------------
    const imgGroup = document.getElementById('imgGroup');
    const leftClip = document.getElementById('leftClip');
    const rightClip = document.getElementById('rightClip');

    const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
    const lerp  = (a,b,t)=>a+(b-a)*t;

    let smoothP = 0;
    const L_COUNT = 12, R_COUNT = 12;
    const leftLaneY  = Array.from({length:L_COUNT+1},()=>0);
    const rightLaneY = Array.from({length:R_COUNT+1},()=>0);

    function getRenderedImageHeightPx() {
      const vw = window.innerWidth || 1;
      const vh = window.innerHeight || 1;
      const scale = Math.max(vw / 1000, vh / 1000); // slice
      return 1000 * scale;
    }

    function buildDripRects(xStart, dir, y, width, t, laneCount, dt, laneBuf){
      const xEnd = clamp(xStart + dir * width, 0, 1);
      const t1 = t * 0.0013, t2 = t * 0.0020;
      let d = "";

      for(let i=0;i<=laneCount;i++){
        const u = i / laneCount;
        const w = 1 - u;
        const x = lerp(xStart, xEnd, u);

        const baseDepth = y + w * 0.28 + (1 - w) * 0.10;
        const wobble =
          Math.sin(t1 + i * 1.05) * (0.005 + w * 0.006) +
          Math.sin(t2 + i * 1.81) * 0.0035;

        const targetY = clamp(baseDepth + wobble, 0, 1);
        const follow = 1 - Math.exp(-dt * 18);
        laneBuf[i] += (targetY - laneBuf[i]) * follow;

        const yy = clamp(laneBuf[i], 0, 1);
        const xl = clamp(x - DRIP_HALF_WIDTH, 0, 1) * 1000;
        const xr = clamp(x + DRIP_HALF_WIDTH, 0, 1) * 1000;
        const yb = yy * 1000;

        d += `M ${xl} 0 L ${xr} 0 L ${xr} ${yb} L ${xl} ${yb} Z `;
      }
      return d;
    }

    let lastTs = 0;
    function tick(ts){
      if(!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const scrollY = window.scrollY || window.pageYOffset || 0;
      const vh = window.innerHeight || 1;

      // Lock point based on real rendered image size
      const renderedImgH = getRenderedImageHeightPx();
      const lockPx = renderedImgH * WHITE_HEADER_FRAC;

      // Phase 1: scroll image upward until white header is gone, then lock
      const bgOffsetPx = -Math.min(scrollY, lockPx);
      const vbOffset = (bgOffsetPx / vh) * 1000;
      imgGroup.setAttribute('transform', `translate(0 ${vbOffset})`);

      // Phase 2: bleed reveal
      const bleedDelayPx = BLEED_START_DELAY_VH * vh;
      const wipeRangePx = WIPE_RANGE_VH * vh;

      const pastTrigger = Math.max(0, scrollY - lockPx - bleedDelayPx);
      const rawP = clamp(pastTrigger / wipeRangePx, 0, 1);

      const pFollow = 1 - Math.exp(-dt * 7.0);
      smoothP += (rawP - smoothP) * pFollow;

      const y = BLEED_START_Y + (BLEED_TRAVEL * smoothP);
      const eyeOpen = Math.pow(smoothP, 0.85);
      const lw = MAX_LEFT_WIDTH * eyeOpen;
      const rw = MAX_RIGHT_WIDTH * eyeOpen;

      leftClip.setAttribute('d', buildDripRects(LEFT_INNER_X, -1, y, lw, ts, L_COUNT, dt, leftLaneY));
      rightClip.setAttribute('d', buildDripRects(RIGHT_INNER_X, +1, y, rw, ts, R_COUNT, dt, rightLaneY));

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
