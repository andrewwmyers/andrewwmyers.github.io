<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
</head>
<body style="margin:0;background:#000;min-height:380vh;overflow-x:hidden;">

  <!-- Base image -->
  <div style="
    position:fixed;
    inset:0;
    background:url('./base.png') center top / cover no-repeat;
    z-index:0;
  "></div>

  <!-- Bleed image (masked by left + right eye drips) -->
  <div id="bleedLayer" style="
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:url('./bleed.png') center top / cover no-repeat;
    clip-path:url(#dualEyeReveal);
    -webkit-clip-path:url(#dualEyeReveal);
  "></div>

  <!-- SVG mask geometry -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="dualEyeReveal" clipPathUnits="objectBoundingBox">
        <path id="leftEyePath" d="M0 0 L0 0 Z"></path>
        <path id="rightEyePath" d="M0 0 L0 0 Z"></path>
      </clipPath>
    </defs>
  </svg>

  <script>
    const HEADER_HEIGHT = 230;
    const WIPE_RANGE = 1800;

    // Approx eye inner-edge centers in normalized screen coords.
    // Tweak these if your eyes are positioned differently in the image.
    const LEFT_INNER_X  = 0.48; // inner edge of left eye (near nose)
    const RIGHT_INNER_X = 0.53; // inner edge of right eye (near nose)

    const leftPath = document.getElementById('leftEyePath');
    const rightPath = document.getElementById('rightEyePath');

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a,b,t) => a + (b-a)*t;

    // Smoothed progress for viscous lag
    let smoothP = 0;

    // Tendril pulses per eye lane (long occasional drips)
    const L_COUNT = 10;
    const R_COUNT = 10;
    const leftPulse = Array.from({length:L_COUNT}, (_,i)=>({amp:0, seed:i*1.37+0.3}));
    const rightPulse= Array.from({length:R_COUNT},(_,i)=>({amp:0, seed:i*1.91+0.8}));

    function updatePulses(arr, p, dt) {
      for (const a of arr) {
        // random burst chance increases mid-reveal
        const burstChance = 0.0015 + 0.0035 * Math.sin((p*Math.PI));
        if (Math.random() < burstChance * dt) {
          a.amp = Math.max(a.amp, 0.08 + Math.random() * 0.22);
        }
        // viscous decay
        a.amp *= Math.pow(0.985, dt * 60);
      }
    }

    function buildEyePath(xStart, dir, y, width, t, pulses, laneCount) {
      // dir: +1 for rightward growth, -1 for leftward growth
      // xStart is inner eye edge; shape grows outward from there
      const xEnd = clamp(xStart + dir * width, 0, 1);

      // Build lane anchors from inner edge to outer edge
      const pts = [];
      for (let i = 0; i <= laneCount; i++) {
        const u = i / laneCount; // 0 inner -> 1 outer
        const x = lerp(xStart, xEnd, u);

        // stronger drips near inner edge, taper outward
        const innerWeight = (1 - u);
        const baseDepth = y + innerWeight * 0.28 + (1-innerWeight)*0.10;

        // unsettling wobble
        const wobble =
          Math.sin(t*0.0023 + i*1.21) * (0.012 + innerWeight*0.010) +
          Math.sin(t*0.0041 + i*2.07) * 0.008;

        // pulse tendrils
        const pulse = (pulses[i % pulses.length].amp || 0) * (0.6 + innerWeight*0.8);

        const yy = clamp(baseDepth + wobble + pulse, 0, 1);
        pts.push({x, y:yy});
      }

      // Slight side sway for whole curtain
      const sway = Math.sin(t*0.0012) * 0.006;
      for (const p of pts) p.x = clamp(p.x + sway * dir, 0, 1);

      // Polygon/curve from top edge down drip contour and back to top
      // Order depends on direction so fill area is correct
      let d = `M ${xStart} 0 L ${xEnd} 0 L ${pts[pts.length-1].x} ${pts[pts.length-1].y} `;
      for (let i = pts.length - 2; i >= 0; i--) {
        const p0 = pts[i+1], p1 = pts[i];
        const cx1 = lerp(p0.x, p1.x, 0.35);
        const cy1 = p0.y;
        const cx2 = lerp(p0.x, p1.x, 0.65);
        const cy2 = p1.y;
        d += `C ${cx1} ${cy1}, ${cx2} ${cy2}, ${p1.x} ${p1.y} `;
      }
      d += `L ${xStart} 0 Z`;
      return d;
    }

    let lastTs = 0;
    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs)/1000); // seconds
      lastTs = ts;

      const s = window.scrollY || window.pageYOffset || 0;
      const rawPast = Math.max(0, s - HEADER_HEIGHT);
      const rawP = clamp(rawPast / WIPE_RANGE, 0, 1);

      // viscous lag (follow raw progress with smoothing)
      const follow = 1 - Math.exp(-dt * 7.5);
      smoothP += (rawP - smoothP) * follow;

      // Edge position from above viewport to below
      const y = -0.30 + (1.42 * smoothP);

      // Width grows from each inner eye edge outward
      // left eye grows leftward, right eye grows rightward
      const maxLeftWidth  = 0.24; // how far left curtain spreads
      const maxRightWidth = 0.24; // how far right curtain spreads
      const eyeOpen = Math.pow(smoothP, 0.85); // opens earlier, dramatic
      const leftWidth  = maxLeftWidth  * eyeOpen;
      const rightWidth = maxRightWidth * eyeOpen;

      // update tendril pulses
      updatePulses(leftPulse, smoothP, dt*60);
      updatePulses(rightPulse, smoothP, dt*60);

      const leftD = buildEyePath(LEFT_INNER_X, -1, y, leftWidth, ts, leftPulse, L_COUNT);
      const rightD = buildEyePath(RIGHT_INNER_X, +1, y, rightWidth, ts, rightPulse, R_COUNT);

      leftPath.setAttribute('d', leftD);
      rightPath.setAttribute('d', rightD);

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
