<script>
  const oozePath = document.getElementById('oozePath');
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  // Scroll tuning
  const WIPE_START_PX = 0;
  const WIPE_RANGE_PX = 1700;

  // Start position on image (0 = very top, 1 = bottom)
  // ~0.33–0.42 is usually around eye line depending on artwork
  const START_Y_FRAC = 0.36;

  // Drip tuning
  const COLS = 56;            // more columns = more strands
  const MAX_WOBBLE = 14;      // horizontal-front wobble amplitude
  const DRIP_DEPTH = 95;      // how long drips can hang down
  const FRONT_SMOOTH = 10;    // overall reveal smoothing
  const COLUMN_LAG = 16;      // per-column viscosity
  const DRIP_SPEED_A = 0.0011;
  const DRIP_SPEED_B = 0.0019;

  let smoothP = 0;
  let lastTs = 0;
  const colY = Array.from({ length: COLS + 1 }, () => START_Y_FRAC * 1000);

  function buildPath(progress, ts, dt) {
    // front moves from START_Y_FRAC down to bottom
    const baseLead = START_Y_FRAC * 1000;
    const travel = (1 - START_Y_FRAC) * 1000;
    const leadY = baseLead + progress * travel;

    const t1 = ts * DRIP_SPEED_A;
    const t2 = ts * DRIP_SPEED_B;

    let d = `M 0 0 L 1000 0 L 1000 ${leadY} `;

    for (let i = COLS; i >= 0; i--) {
      const u = i / COLS;
      const x = u * 1000;

      // central area drips a bit more than far edges
      const centerWeight = 1 - Math.abs(u - 0.5) * 1.35;
      const w = clamp(centerWeight, 0.2, 1.0);

      // moving wobble
      const wobble =
        (Math.sin(t1 + u * 11.0) + 0.55 * Math.sin(t2 + u * 19.0))
        * MAX_WOBBLE * (0.45 + 0.55 * Math.sin(Math.PI * progress));

      // drip fingers: always downward offsets, animated over time
      const dripWave =
        Math.sin(t1 * 0.9 + u * 24.0) * 0.5 +
        Math.sin(t2 * 1.1 + u * 41.0) * 0.5;

      // map -1..1 -> 0..1, then bias toward smaller values with occasional long drips
      const drip01 = Math.pow((dripWave + 1) * 0.5, 1.8);

      // stronger drips early/mid, taper late
      const dripEnvelope = Math.sin(Math.PI * clamp(progress, 0, 1));
      const drip = drip01 * DRIP_DEPTH * dripEnvelope * w;

      const target = clamp(leadY + wobble + drip, 0, 1000);

      const follow = 1 - Math.exp(-dt * COLUMN_LAG);
      colY[i] += (target - colY[i]) * follow;

      d += `L ${x} ${clamp(colY[i], 0, 1000)} `;
    }

    d += `L 0 0 Z`;
    return d;
  }

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    const scrollY = window.scrollY || window.pageYOffset || 0;
    const raw = clamp((scrollY - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);

    const follow = 1 - Math.exp(-dt * FRONT_SMOOTH);
    smoothP += (raw - smoothP) * follow;

    oozePath.setAttribute('d', buildPath(smoothP, ts, dt));
    requestAnimationFrame(tick);
  }

  // initialize shape at start line
  oozePath.setAttribute('d', `M0 0 L1000 0 L1000 ${START_Y_FRAC*1000} L0 ${START_Y_FRAC*1000} Z`);
  requestAnimationFrame(tick);
</script>
