<body style="margin:0;background:#000;overflow-x:hidden;">

  <!-- Scroll runway -->
  <div style="height:320vh;"></div>

  <!-- Base -->
  <div id="baseLayer" style="
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:url('./base.png');
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center 0px;
  "></div>

  <!-- Bleed (locked to same transform as base) -->
  <div id="bleedLayer" style="
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background-image:url('./bleed.png');
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center 0px;

    -webkit-mask:url(#dripMask);
    mask:url(#dripMask);
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
  "></div>
