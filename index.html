<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height: 430vh; }

    #stage{
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    #headShell{
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      z-index: 2;
      overflow: hidden;
    }

    #headSvg{
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">

        <defs>
          <mask id="oozeMaskLeft" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathLeft" d="M0 0 L0 0 Z" fill="white"></path>
          </mask>

          <mask id="oozeMaskRight" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePathRight" d="M0 0 L0 0 Z" fill="white"></path>
          </mask>
        </defs>

        <image href="./head-base.png" xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskLeft)"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMaskRight)"></image>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const leftPath = document.getElementById('oozePathLeft');
      const rightPath = document.getElementById('oozePathRight');
      if (!leftPath || !rightPath) return;

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      // required baseline
      const START_Y_FRAC = 0.045;

      // Scroll timing
      const WIPE_START_PX = 0;
      const WIPE_RANGE_PX = 4200;
      const FRONT_FOLLOW = 4.6;

      // NEW: pre-drop behavior
      const PREDROP_SCROLL_PX = 200;   // scroll distance used for initial extension phase
      const PREDROP_DISTANCE_PX = 210; // fixed distance drips extend before normal tracking

      // eye columns
      const LEFT_CENTER_X  = 455;
      const RIGHT_CENTER_X = 545;
      const HALF_WIDTH = 46;

      // rounded horror drip tuning
      const LANES = 20;
      const WOBBLE_PX = 6;
      const DRIP_PX = 235;
      const LANE_FOLLOW_MIN = 3.0;
      const LANE_FOLLOW_MAX = 6.2;

      let smoothP = 0, lastTs = 0;

      function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      function makeState(seed) {
        return Array.from({ length: LANES + 1 }, (_, i) => ({
          y: START_Y_FRAC * 1000,
          lag: LANE_FOLLOW_MIN + (LANE_FOLLOW_MAX - LANE_FOLLOW_MIN) * hash(seed + i * 1.7),
          a: hash(seed + i * 2.3) * Math.PI * 2,
          b: hash(seed + i * 3.1) * Math.PI * 2,
          amp: 0.75 + 0.65 * hash(seed + i * 4.9),
          bias: 1.45 + 1.1 * hash(seed + i * 6.7)
        }));
      }

      const leftState = makeState(10);
      const rightState = makeState(90);

      function buildRoundedColumnPath(centerX, halfW, state, ts, dt, progress, idBase, preDropPx) {
        const x0 = clamp(centerX - halfW, 0, 1000);
        const x1 = clamp(centerX + halfW, 0, 1000);

        const baseLead = START_Y_FRAC * 1000 + progress * ((1 - START_Y_FRAC) * 1000);
        const leadY = clamp(baseLead + preDropPx, 0, 1000);

        const env = Math.sin(Math.PI * progress);
        const t1 = ts * 0.00095;
        const t2 = ts * 0.00155;

        const pts = [];
        for (let j = 0; j <= LANES; j++) {
          const u = j / LANES;
          const x = x0 + (x1 - x0) * u;
          const s = state[j];

          const wobble =
            (Math.sin(t1 + u * 7.5 + s.a) + 0.5 * Math.sin(t2 + u * 13.5 + s.b))
            * WOBBLE_PX * s.amp * (0.35 + 0.75 * env);

          const p1 = (Math.sin(ts * 0.0019 + idBase + j * 1.13) + 1) * 0.5;
          const p2 = (Math.sin(ts * 0.0036 + idBase + j * 1.91) + 1) * 0.5;
          const pulse = Math.pow(0.6 * p1 + 0.4 * p2, s.bias);

          const drip = pulse * DRIP_PX * env * s.amp;
          const target = clamp(leadY + wobble + drip, 0, 1000);

          const f = 1 - Math.exp(-dt * s.lag);
          s.y += (target - s.y) * f;

          pts.push({ x, y: clamp(s.y, 0, 1000) });
        }

        let d = `M ${x0} 0 L ${x1} 0 L ${pts[LANES].x} ${pts[LANES].y} `;
        for (let j = LANES - 1; j >= 0; j--) {
          const p = pts[j + 1];
          const n = pts[j];
          const cx = (p.x + n.x) * 0.5;
          const cy = (p.y + n.y) * 0.5;
          d += `Q ${p.x} ${p.y} ${cx} ${cy} `;
        }
        d += `L ${x0} 0 Z`;
        return d;
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        const y = window.scrollY || window.pageYOffset || 0;

        // Phase A: fixed pre-drop extension (first chunk of scroll)
        const preT = clamp((y - WIPE_START_PX) / PREDROP_SCROLL_PX, 0, 1);
        const preEase = 1 - Math.pow(1 - preT, 3); // easeOutCubic
        const preDropPx = PREDROP_DISTANCE_PX * preEase;

        // Phase B: normal scroll tracking after pre-drop window
        const raw = clamp((y - WIPE_START_PX - PREDROP_SCROLL_PX) / WIPE_RANGE_PX, 0, 1);

        const f = 1 - Math.exp(-dt * FRONT_FOLLOW);
        smoothP += (raw - smoothP) * f;

        leftPath.setAttribute('d', buildRoundedColumnPath(
          LEFT_CENTER_X, HALF_WIDTH, leftState, ts, dt, smoothP, 1000, preDropPx
        ));
        rightPath.setAttribute('d', buildRoundedColumnPath(
          RIGHT_CENTER_X, HALF_WIDTH, rightState, ts, dt, smoothP, 2000, preDropPx
        ));

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
