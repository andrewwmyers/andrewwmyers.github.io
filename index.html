<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow-x: hidden;
    }

    .scroll-runway { height: 430vh; }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
      z-index: 1;
    }

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 1;
    }

    /* Locked, top-anchored head container */
    #headShell {
      position: absolute;
      left: 50%;
      top: 0;
      width: min(1800px, 125vw); /* very large */
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      transform-origin: top center;
      z-index: 2;
      overflow: hidden;
    }

    .headLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
    }

    #baseLayer { z-index: 1; }
    #bleedLayer {
      z-index: 2;
      /* Mask assigned in JS */
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      -webkit-mask-position: 0 0;
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
      mask-position: 0 0;
      will-change: -webkit-mask-image, mask-image;
    }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />

    <div id="headShell">
      <img id="baseLayer" class="headLayer" src="./head-base.png" alt="" />
      <img id="bleedLayer" class="headLayer" src="./head-bleed.png" alt="" />
    </div>
  </div>

  <script>
    const bleed = document.getElementById('bleedLayer');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp  = (a, b, t) => a + (b - a) * t;

    // Scroll tuning
    const WIPE_START_PX = 10;     // when reveal begins
    const WIPE_RANGE_PX = 1700;   // scroll distance to reach full reveal

    // Ooze tuning
    const COLS = 72;              // more columns = smoother edge
    const EDGE_SOFTEN_PX = 2;     // blur-ish soft edge via gradient span
    const MAX_WOBBLE_PX = 22;     // vertical wobble amplitude near leading edge
    const FOLLOW_SPEED = 11;      // larger = snappier

    let smoothP = 0;
    let lastTs = 0;

    // per-column lag memory for gooey behavior
    const colLag = Array.from({ length: COLS + 1 }, () => 0);

    function buildOozeMask(progress, t, dt) {
      // progress: 0..1 (how much of bleed is revealed top->bottom)
      const leadY = progress * 1000; // mask space height
      const time1 = t * 0.0012;
      const time2 = t * 0.0019;

      let d = `M 0 0 L 1000 0 L 1000 ${leadY} `;

      for (let i = COLS; i >= 0; i--) {
        const u = i / COLS;           // 0..1 across x
        const x = u * 1000;

        // Stronger wobble near the advancing front when progress is mid-range
        const phase = Math.sin(time1 + u * 9.5) + Math.sin(time2 + u * 17.0) * 0.6;
        const envelope = Math.sin(Math.PI * clamp(progress, 0, 1)); // peaks around mid progress
        const wobble = phase * MAX_WOBBLE_PX * envelope;

        // target front for this column
        const target = clamp(leadY + wobble, 0, 1000);

        // per-column easing => viscous ooze feel
        const follow = 1 - Math.exp(-dt * (16 - 6 * Math.abs(u - 0.5)));
        colLag[i] += (target - colLag[i]) * follow;

        const y = clamp(colLag[i], 0, 1000);
        d += `L ${x} ${y} `;
      }

      d += `L 0 0 Z`;

      // White reveals, black hides
      const svg =
`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000' preserveAspectRatio='none'>
  <rect width='1000' height='1000' fill='black'/>
  <path d='${d}' fill='white'/>
  <filter id='s'>
    <feGaussianBlur stdDeviation='${EDGE_SOFTEN_PX}' />
  </filter>
</svg>`;

      return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
    }

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      const y = window.scrollY || window.pageYOffset || 0;
      const raw = clamp((y - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);

      const follow = 1 - Math.exp(-dt * FOLLOW_SPEED);
      smoothP += (raw - smoothP) * follow;

      const maskUrl = buildOozeMask(smoothP, ts, dt);
      bleed.style.webkitMaskImage = maskUrl;
      bleed.style.maskImage = maskUrl;

      requestAnimationFrame(tick);
    }

    // initialize hidden
    bleed.style.webkitMaskImage = buildOozeMask(0, 0, 0.016);
    bleed.style.maskImage = bleed.style.webkitMaskImage;

    requestAnimationFrame(tick);
  </script>
</body>
</html>
