<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow-x:hidden; }
    .scroll-runway { height:430vh; }

    #stage{
      position:fixed; inset:0; overflow:hidden; pointer-events:none;
      background:#000; z-index:1;
    }

    #bg{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; object-position:center top; z-index:1;
      user-select:none; -webkit-user-drag:none;
    }

    #headShell{
      position:absolute; left:50%; top:0;
      width:min(1800px,125vw); aspect-ratio:1/1;
      transform:translateX(-50%);
      z-index:2; overflow:hidden;
    }

    #headSvg{ width:100%; height:100%; display:block; overflow:visible; }
  </style>
</head>
<body>
  <div class="scroll-runway"></div>

  <div id="stage">
    <img id="bg" src="./black-bg.png" alt="" />
    <div id="headShell">
      <svg id="headSvg"
           viewBox="0 0 1000 1000"
           preserveAspectRatio="xMidYMin meet"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">
        <defs>
          <mask id="oozeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
            <rect x="0" y="0" width="1000" height="1000" fill="black"></rect>
            <path id="oozePath" d="M0 0 L1000 0 L1000 0 L0 0 Z" fill="white"></path>
          </mask>
        </defs>

        <image href="./head-base.png" xlink:href="./head-base.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"></image>

        <image href="./head-bleed.png" xlink:href="./head-bleed.png"
               x="0" y="0" width="1000" height="1000"
               preserveAspectRatio="xMidYMin meet"
               mask="url(#oozeMask)"></image>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const oozePath = document.getElementById('oozePath');
      if (!oozePath) return;

      const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

      // Required baseline from you
      const START_Y_FRAC = 0.045;

      // Stable, simple full-width wipe (safe baseline)
      const WIPE_START_PX = 0;
      const WIPE_RANGE_PX = 1700;
      const COLS = 40;
      const WOBBLE = 10;

      let smoothP = 0;
      let lastTs = 0;
      const laneY = Array.from({ length: COLS + 1 }, () => START_Y_FRAC * 1000);

      function buildPath(progress, ts, dt) {
        const leadY = START_Y_FRAC * 1000 + progress * ((1 - START_Y_FRAC) * 1000);
        const t = ts * 0.0012;

        let d = `M 0 0 L 1000 0 L 1000 ${leadY} `;
        for (let i = COLS; i >= 0; i--) {
          const u = i / COLS;
          const x = u * 1000;
          const wob = Math.sin(t + u * 10) * WOBBLE * Math.sin(Math.PI * progress);
          const target = clamp(leadY + wob, 0, 1000);
          const follow = 1 - Math.exp(-dt * 14);
          laneY[i] += (target - laneY[i]) * follow;
          d += `L ${x} ${clamp(laneY[i], 0, 1000)} `;
        }
        d += `L 0 0 Z`;
        return d;
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        const y = window.scrollY || window.pageYOffset || 0;
        const raw = clamp((y - WIPE_START_PX) / WIPE_RANGE_PX, 0, 1);
        const follow = 1 - Math.exp(-dt * 10);
        smoothP += (raw - smoothP) * follow;

        oozePath.setAttribute('d', buildPath(smoothP, ts, dt));
        requestAnimationFrame(tick);
      }

      oozePath.setAttribute('d', `M0 0 L1000 0 L1000 ${START_Y_FRAC*1000} L0 ${START_Y_FRAC*1000} Z`);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
