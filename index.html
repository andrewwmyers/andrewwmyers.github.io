<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers – Floating Head</title>
  <style>
    html, body {
      margin: 0;
      background: #000;
      overflow-x: hidden;
    }

    .scroll-runway { height: 520vh; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      background: #000;
    }

    /* Background stays full-bleed */
    #bgLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      z-index: 1;
    }

    /* Single SVG engine for BOTH head images = perfect alignment */
    #headSvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      will-change: transform;
    }
  </style>
</head>

  <div class="scroll-runway"></div>
