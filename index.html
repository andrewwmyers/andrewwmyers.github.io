<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
</head>
<body style="margin:0;background:#000;min-height:300vh;">

  <!-- Base image (fixed/static) -->
  <div id="baseLayer" style="
    position:fixed;
    inset:0;
    background:url('./base.png') center top / cover no-repeat;
    z-index:0;
  "></div>

  <!-- Bleed image overlay (fixed/static, revealed by scroll) -->
  <div id="bleedLayer" style="
    position:fixed;
    inset:0;
    background:url('./bleed.png') center top / cover no-repeat;
    z-index:1;
    opacity:0;
    pointer-events:none;
  "></div>

  <script>
    // Adjust these two numbers only if needed
    const HEADER_HEIGHT = 230; // trigger starts after this much scroll
    const REVEAL_RANGE = 1200; // distance to go from 0 -> 100% reveal

    const bleedLayer = document.getElementById('bleedLayer');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function tick() {
      const y = window.scrollY || window.pageYOffset || 0;

      // start once header is no longer fully visible
      const pastTrigger = Math.max(0, y - HEADER_HEIGHT);
      const progress = clamp(pastTrigger / REVEAL_RANGE, 0, 1);

      // fade in bleed image as user scrolls down; reverses on scroll up
      bleedLayer.style.opacity = progress.toFixed(4);

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
