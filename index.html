<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wade Myers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background:#000; color:#fff; font-family: Arial, sans-serif; }

    /* Fixed background stays static */
    .bg {
      position: fixed;
      inset: 0;
      background: url('./bg-desktop.png') center top / cover no-repeat;
      z-index: 0;
    }

    /* White header sits ABOVE background and scrolls away */
    .hero-header {
      position: relative;
      height: 230px;
      z-index: 30;
    }
    .hero-header .header-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-header .header-logo {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(42vw, 520px);
      height: auto;
      display: block;
      z-index: 31;
    }

    /* Bleed lines layer: fixed, behind content, above bg */
    .lines-wrap {
      position: fixed;
      left: 50%;
      top: 13.5%;
      transform: translateX(-50%);
      width: min(22vw, 360px);
      height: 80vh;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    .lines {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      clip-path: inset(100% 0 0 0); /* hidden until trigger */
      opacity: 0.96;
      display: block;
    }

    /* Content above lines */
    main.content {
      position: relative;
      z-index: 20;
    }
    .panel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .chip {
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.45);
      padding: 12px 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .hero-header { height: 160px; }
      .hero-header .header-logo { width: min(68vw, 420px); }
      .lines-wrap { top: 14.5%; width: min(34vw, 300px); height: 76vh; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="hero-header" id="heroHeader">
    <img class="header-bg" src="./header.png" alt="" />
    <img class="header-logo" src="./header-logo.png" alt="Wade Myers" />
  </header>

  <div class="lines-wrap" aria-hidden="true">
    <img class="lines" id="lines" src="./lines-animation.png" alt="" />
  </div>

  <main class="content">
    <section id="listen" class="panel"><div class="chip">Listen</div></section>
    <section id="watch" class="panel"><div class="chip">Watch</div></section>
    <section id="store" class="panel"><div class="chip">Store</div></section>
    <section id="about" class="panel"><div class="chip">About</div></section>
    <section id="contact" class="panel"><div class="chip">Contact</div></section>
  </main>

  <script>
    const header = document.getElementById('heroHeader');
    const lines = document.getElementById('lines');
    const REVEAL_RANGE = 1500; // px to fully reveal after trigger

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function animate() {
      // Start ONLY once header is no longer fully visible:
      // header bottom <= 0 means header has fully exited viewport.
      const headerBottom = header.getBoundingClientRect().bottom;
      const pastTrigger = Math.max(0, -headerBottom);
      const progress = clamp(pastTrigger / REVEAL_RANGE, 0, 1);

      // Reveal lines top -> bottom
      const hiddenTop = (1 - progress) * 100;
      lines.style.clipPath = `inset(${hiddenTop}% 0 0 0)`;

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
